server {
  listen 80;
  server_name _;
  # In production redirect to HTTPS once certs exist in ./certs (see README).
  location / { proxy_pass http://frontend:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off; # SSE task stream
  }
}
# HTTPS example (uncomment after placing fullchain.pem/privkey.pem in ./certs):
# server { listen 443 ssl http2; server_name portal.example.com;
#   ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   location / { proxy_pass http://frontend:80; }
#   location /api/ { proxy_pass http://backend:3000; proxy_buffering off; } }
